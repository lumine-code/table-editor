name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Inspect package payload
        run: npm pack --dry-run

  integration:
    name: Lumine integration specs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_DISABLE_SHELLING_OUT_FOR_ENVIRONMENT: "true"
      TEMP: ${{ github.workspace }}/table-spec-tmp
      TMP: ${{ github.workspace }}/table-spec-tmp
      TMPDIR: ${{ github.workspace }}/table-spec-tmp
    steps:
      - uses: actions/checkout@v7
        with:
          path: table-editor
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux display and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Create private temporary directory
        run: mkdir -p "$TEMP"
      - name: Install package dependencies
        working-directory: table-editor
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Download Electron
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Install spec dependency packages
        working-directory: lumine
        run: node script/install-spec-packages.js --package ../table-editor --home "$RUNNER_TEMP/table-home" --github-env "$GITHUB_ENV"
      - name: Run Jasmine specs
        working-directory: lumine
        timeout-minutes: 20
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum npm start -- --test ../table-editor/spec
          else
            npm start -- --test ../table-editor/spec
          fi
